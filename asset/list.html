<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资产列表 · 中石化易派客</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<script src="../../prototype-admin/assets/js/common.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var U = WB_U, DB = WB_DB, E = WB_ENGINE, X = APP.X;
  APP.boot();
  var me = APP.me();

  var qs = new URLSearchParams(location.search);
  var F = {
    kw: qs.get('kw') || '',
    cat: qs.get('cat') ? [qs.get('cat')] : [],
    region: qs.get('region') || '',
    lo: qs.get('lo') || '',
    hi: qs.get('hi') || '',
    st: qs.get('st') || '',
    org: qs.get('org') || '',
    sort: qs.get('sort') || 'new'
  };
  var PAGE = 1, SIZE = 6;

  function sesOf(a) {
    return DB.find('sessions', function (s) { return s.asset_id === a.asset_id && s.status !== '已终止'; });
  }

  function filtered() {
    var list = DB.all('assets').filter(function (a) {
      if (a.asset_status === '已关闭') return false;
      var s = sesOf(a);
      if (F.kw && String(a.asset_name).indexOf(F.kw) < 0 && String(a.asset_code).indexOf(F.kw) < 0) return false;
      if (F.cat.length && F.cat.indexOf(a.category) < 0) return false;
      if (F.region && String(a.region || '').indexOf(F.region) < 0) return false;
      if (F.lo && a.start_price < Number(F.lo) * 10000) return false;
      if (F.hi && a.start_price >= Number(F.hi) * 10000) return false;
      if (F.org && a.disposal_org_id !== F.org) return false;
      if (F.st === 'live' && (!s || s.status !== '竞拍中')) return false;
      if (F.st === 'soon' && (!s || (s.status !== '预告' && s.status !== '报名中' && s.status !== '报名截止'))) return false;
      if (F.st === 'end' && (!s || (s.status !== '已结束' && s.status !== '已归档'))) return false;
      return true;
    });
    var order = { 竞拍中: 0, 报名中: 1, 报名截止: 2, 预告: 3, 已结束: 4, 已归档: 5 };
    if (F.sort === 'new') list.sort(function (a, b) { return String(b.publish_time).localeCompare(String(a.publish_time)); });
    if (F.sort === 'soon') list.sort(function (a, b) {
      var sa = sesOf(a), sb = sesOf(b);
      var oa = sa ? (order[sa.status] === undefined ? 9 : order[sa.status]) : 9;
      var ob = sb ? (order[sb.status] === undefined ? 9 : order[sb.status]) : 9;
      return oa - ob;
    });
    if (F.sort === 'price') list.sort(function (a, b) { return a.start_price - b.start_price; });
    if (F.sort === 'price-d') list.sort(function (a, b) { return b.start_price - a.start_price; });
    return list;
  }

  function cardHTML(a) {
    var s = sesOf(a);
    var dp = E.depositPlan(me, a.start_price);
    var cd = s ? X.countdown(s.status === '竞拍中' ? s.bid_end : s.reg_end, APP.SERVER_TIME) : null;
    var stCls = !s ? 'end' : s.status === '竞拍中' ? 'live' : (s.status === '已结束' || s.status === '已归档') ? 'end' : 'soon';
    var stTxt = !s ? '未开场' : s.status;
    var follow = DB.all('interests').filter(function (f) { return f.asset_id === a.asset_id && f.act_type === '关注'; }).length;
    return '<div class="asset-card" data-go="asset/detail.html?id=' + a.asset_id + '">' +
      '<div class="ac-img"><span class="st ' + stCls + '">' + X.esc(stTxt) + '</span>' +
      APP.catIcon(a.category) +
      (cd && !cd.over ? '<span class="cd">' + (s.status === '竞拍中' ? '距结束 ' : '距报名截止 ') + cd.txt + '</span>' : '') +
      '</div>' +
      '<div class="ac-b">' +
      '<div class="ac-t">' + X.esc(a.asset_name) + '</div>' +
      '<div class="ac-tags">' + APP.tag(a.category, 'pri') + APP.tag(a.region || '—') +
      (a.required_qual && a.required_qual.length ? APP.tag('需 ' + a.required_qual.length + ' 项资质', 'warn') : '') + '</div>' +
      '<div class="ac-m">' +
      '<div><div class="xs muted">' + (s && s.status === '竞拍中' ? '当前价' : '起拍价') + '</div>' +
      '<div class="price mid">' + X.w(s && s.status === '竞拍中' ? s.current_price : a.start_price) + '<span class="u">万</span></div>' +
      '<div class="xs muted">保证金 ' + X.w(dp.amount) + ' 万（' + X.esc(dp.ruleCode) + '）</div></div>' +
      '<div class="right xs muted">' + X.esc(a.disposal_org || '') + '<br>' + (follow ? '★ ' + follow + ' 人关注' : '') + '</div>' +
      '</div></div></div>';
  }

  function bodyHTML() {
    var list = filtered();
    var show = list.slice(0, PAGE * SIZE);
    var head = '<div class="card"><div class="cb" style="padding:10px">' +
      '<div class="fld" style="margin-bottom:8px"><input id="kw" placeholder="搜索资产名称 / 编码" value="' + X.esc(F.kw) + '"></div>' +
      '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">' +
      ['st', 'cat', 'region', 'price', 'org', 'sort'].map(function () { return ''; }).join('') +
      '<button class="btn sm" data-open-filter="st">' + (F.st ? '状态：' + ({ live: '竞拍中', soon: '即将开拍', end: '已结束' }[F.st] || '全部') : '状态') + ' ▾</button>' +
      '<button class="btn sm" data-open-filter="cat">' + (F.cat.length ? '品类：' + F.cat.join('/') : '品类') + ' ▾</button>' +
      '<button class="btn sm" data-open-filter="region">' + (F.region ? '区域：' + F.region : '区域') + ' ▾</button>' +
      '<button class="btn sm" data-open-filter="price">' + ((F.lo || F.hi) ? '价格：' + (F.lo || '不限') + '-' + (F.hi || '不限') + '万' : '价格区间') + ' ▾</button>' +
      '<button class="btn sm" data-open-filter="org">' + (F.org ? '单位：' + WB.orgName(F.org) : '所属单位') + ' ▾</button>' +
      '<button class="btn sm" data-open-filter="sort">' + ({ new: '最新发布', soon: '即将开拍', price: '价格升序', 'price-d': '价格降序' }[F.sort]) + ' ▾</button>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-top:8px;align-items:center">' +
      '<button class="btn sm line-pri" id="saveSub">＋ 按此条件订阅</button>' +
      '<button class="btn sm ghost" id="reset">重置</button>' +
      '<span class="xs muted" style="margin-left:auto">命中 <b>' + list.length + '</b> 项</span>' +
      '</div></div></div>';

    if (!list.length) {
      return head + '<div class="empty"><div class="ei">📭</div><div class="et">没有符合条件的资产</div>' +
        '<div class="es">试试放宽价格区间或更换品类</div>' +
        '<button class="btn line-pri sm" style="margin-top:10px" id="reset2">清空筛选</button></div>' +
        suggestHTML();
    }
    return head + show.map(cardHTML).join('') +
      (show.length < list.length ? '<button class="btn blk" id="more">上拉加载更多（还有 ' + (list.length - show.length) + ' 项）</button>' : '<div class="center xs muted" style="padding:12px">已加载全部 ' + list.length + ' 项</div>');
  }

  function suggestHTML() {
    var cats = DICT.category.filter(function (c) {
      return DB.all('assets').some(function (a) { return a.category === c && a.asset_status !== '已关闭'; });
    }).slice(0, 6);
    return APP.card('推荐品类', '<div class="ac-tags">' + cats.map(function (c) {
      return '<a href="' + APP.href('asset/list.html?cat=' + encodeURIComponent(c)) + '" style="text-decoration:none">' + APP.tag(c, 'pri') + '</a>';
    }).join(' ') + '</div>');
  }

  function render() {
    APP.mount(APP.shell({
      title: '资产列表', back: false, tab: 'assets', sideActive: '资产列表 / 搜索',
      body: bodyHTML()
    }));
    bind();
  }

  function bind() {
    var kw = document.getElementById('kw');
    if (kw) {
      kw.oninput = function () { F.kw = kw.value.trim(); };
      kw.onchange = kw.onkeydown = function (e) { if (e.type === 'change' || e.key === 'Enter') { PAGE = 1; render(); } };
    }
    var m = document.getElementById('more');
    if (m) m.onclick = function () { PAGE++; render(); };
    ['reset', 'reset2'].forEach(function (id) {
      var b = document.getElementById(id);
      if (b) b.onclick = function () { F = { kw: '', cat: [], region: '', lo: '', hi: '', st: '', org: '', sort: 'new' }; PAGE = 1; render(); };
    });
    var ss = document.getElementById('saveSub');
    if (ss) ss.onclick = function () { saveSubscription(); };
    document.querySelectorAll('[data-open-filter]').forEach(function (b) {
      b.onclick = function () { openFilter(b.getAttribute('data-open-filter')); };
    });
  }

  /* 一键按当前条件订阅（写入 rules 的 Subscription 规则，与推荐引擎 RR01 同源，创建即生效） */
  function saveSubscription() {
    var name = (F.cat.length ? F.cat.join('/') : '全部品类') + (F.region ? ' · ' + F.region : '');
    var hit = filtered().length;
    APP.dialog({
      title: '按此条件订阅',
      body: '将创建订阅：<br><b>' + X.esc(name) + '</b><br>' +
        '价格区间 ' + (F.lo || '不限') + ' ~ ' + (F.hi || '不限') + ' 万元<br>' +
        '命中提醒渠道：APP 推送<br>' +
        '<span class="xs muted">订阅是独立业务对象（Subscription），不是账户上的一个开关；创建后由推荐引擎实时匹配。</span>',
      okText: '创建订阅',
      onOk: function () {
        var rec = APP.subSave({
          categories: F.cat.slice(),
          regions: F.region ? [F.region] : [],
          price_min: F.lo ? Number(F.lo) * 10000 : 0,
          price_max: F.hi ? Number(F.hi) * 10000 : 0,
          channels: ['APP 推送']
        });
        APP.toast('订阅已创建 ' + X.esc(rec.code) + '，命中 ' + APP.subCount(rec) + ' 项在售资产', 'ok');
      }
    });
  }

  /* 筛选面板（底部弹出，逐项真实生效） */
  function openFilter(kind) {
    var body = '', title = '筛选';
    if (kind === 'st') {
      title = '资产状态';
      body = ['', 'live', 'soon', 'end'].map(function (v) {
        return '<div class="list"><a class="li" data-pick="st:' + v + '"><div class="li-main"><div class="li-t">' +
          (v === '' ? '全部' : { live: '竞拍中', soon: '即将开拍', end: '已结束' }[v]) + '</div></div>' +
          (F.st === v ? '<span class="c-pri">✓</span>' : '<span class="arrow">›</span>') + '</a></div>';
      }).join('');
    } else if (kind === 'cat') {
      title = '品类（可多选）';
      body = '<div class="ac-tags">' + DICT.category.map(function (c) {
        var on = F.cat.indexOf(c) >= 0;
        return '<span data-mcat="' + X.esc(c) + '" class="tag ' + (on ? 'pri' : '') + '" style="cursor:pointer;padding:6px 11px">' + X.esc(c) + '</span>';
      }).join(' ') + '</div>';
    } else if (kind === 'region') {
      title = '资产属地';
      var regions = [];
      DB.all('assets').forEach(function (a) { if (a.region && regions.indexOf(a.region) < 0) regions.push(a.region); });
      body = ['',].concat(regions).map(function (v) {
        return '<div class="list"><a class="li" data-pick="region:' + X.esc(v) + '"><div class="li-main"><div class="li-t">' +
          (v || '不限') + '</div></div>' + (F.region === v ? '<span class="c-pri">✓</span>' : '<span class="arrow">›</span>') + '</a></div>';
      }).join('');
    } else if (kind === 'price') {
      title = '价格区间（万元）';
      body = '<div class="fld"><label>起（万元）</label><input id="plo" type="number" value="' + X.esc(F.lo) + '" placeholder="不限"></div>' +
        '<div class="fld"><label>止（万元）</label><input id="phi" type="number" value="' + X.esc(F.hi) + '" placeholder="不限"></div>' +
        '<div class="xs muted">起拍价区间，左闭右开：起 ≤ 价格 &lt; 止</div>';
    } else if (kind === 'org') {
      title = '所属处置单位';
      body = ['',].concat(WB.orgList().map(function (o) { return o.org_id; })).map(function (v) {
        return '<div class="list"><a class="li" data-pick="org:' + X.esc(v) + '"><div class="li-main"><div class="li-t">' +
          (v ? WB.orgName(v) : '全部单位') + '</div></div>' + (F.org === v ? '<span class="c-pri">✓</span>' : '<span class="arrow">›</span>') + '</a></div>';
      }).join('');
    } else {
      title = '排序';
      body = ['new', 'soon', 'price', 'price-d'].map(function (v) {
        return '<div class="list"><a class="li" data-pick="sort:' + v + '"><div class="li-main"><div class="li-t">' +
          ({ new: '最新发布', soon: '即将开拍优先', price: '价格从低到高', 'price-d': '价格从高到低' }[v]) + '</div></div>' +
          (F.sort === v ? '<span class="c-pri">✓</span>' : '<span class="arrow">›</span>') + '</a></div>';
      }).join('');
    }
    APP.sheet({
      title: title, body: body,
      foot: '<button class="btn grow" data-close="1">取消</button><button class="btn pri grow" id="fapply">确定</button>',
      onReady: function (w) {
        w.querySelectorAll('[data-pick]').forEach(function (el) {
          el.onclick = function () {
            var parts = el.getAttribute('data-pick').split(':');
            var k = parts[0], v = parts.slice(1).join(':');
            if (k === 'st') F.st = v; if (k === 'region') F.region = v; if (k === 'org') F.org = v; if (k === 'sort') F.sort = v;
            PAGE = 1; APP.closeSheets(); render();
          };
        });
        w.querySelectorAll('[data-mcat]').forEach(function (el) {
          el.onclick = function () {
            var c = el.getAttribute('data-mcat');
            var i = F.cat.indexOf(c);
            if (i >= 0) F.cat.splice(i, 1); else F.cat.push(c);
            el.classList.toggle('pri');
          };
        });
        var ap = w.querySelector('#fapply');
        if (ap) ap.onclick = function () {
          var lo = w.querySelector('#plo'), hi = w.querySelector('#phi');
          if (lo) F.lo = lo.value.trim();
          if (hi) F.hi = hi.value.trim();
          if (F.lo && F.hi && Number(F.lo) >= Number(F.hi)) { APP.toast('价格区间起值须小于止值', 'err'); return; }
          PAGE = 1; APP.closeSheets(); render();
        };
      }
    });
  }

  render();
})();
</script>
</body>
</html>
