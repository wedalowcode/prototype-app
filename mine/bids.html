<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的竞拍 · 中石化易派客</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<script src="../../prototype-admin/assets/js/common.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var U = WB_U, DB = WB_DB, E = WB_ENGINE, X = APP.X;
  APP.boot();
  var me = APP.me();

  var qs = new URLSearchParams(location.search);
  var TAB = qs.get('v') === 'end' ? 'end' : qs.get('v') === 'bids' ? 'bids' : 'live';

  function mySessions() {
    var out = [];
    APP.myRegs().forEach(function (r) {
      var s = DB.get('sessions', r.session_id);
      if (!s) return;
      out.push({ s: s, r: r });
    });
    return out;
  }
  function liveList() {
    return mySessions().filter(function (x) { return ['竞拍中', '报名中', '报名截止', '预告'].indexOf(x.s.status) >= 0; });
  }
  function endList() {
    return mySessions().filter(function (x) { return ['已结束', '已归档', '已终止'].indexOf(x.s.status) >= 0; });
  }

  function sesCard(x) {
    var s = x.s, r = x.r;
    var a = DB.get('assets', s.asset_id);
    var myBids = DB.all('bids').filter(function (b) { return b.session_id === s.session_id && b.subject_id === me.subject_id; })
      .sort(function (p, q) { return q.bid_seq - p.bid_seq; });
    var deal = DB.find('deals', function (d) { return d.session_id === s.session_id; });
    var cd = X.countdown(s.status === '竞拍中' ? s.bid_end : s.reg_end, APP.SERVER_TIME);
    var iWon = !!(deal && deal.buyer_id === me.subject_id);
    var isTop = myBids.length && s.top_bidder === me.subject_id;

    var result = '';
    if (deal) result = iWon ? APP.tag('已成交', 'ok') : APP.tag('未中拍', '');
    else if (s.meet_reserve === false) result = APP.tag('流拍', 'warn');
    else if (['竞拍中', '报名中', '报名截止'].indexOf(s.status) >= 0) {
      result = isTop ? APP.tag('★ 领先', 'pri') : (myBids.length ? APP.tag('被超越', 'danger') : APP.tag('未出价', 'warn'));
    } else result = APP.tag(s.status, '');

    return '<div class="card flat" style="margin-bottom:10px"><div class="cb" style="padding:11px 12px">' +
      '<div style="display:flex;gap:10px">' +
      '<span style="font-size:24px">' + APP.catIcon(a ? a.category : '') + '</span>' +
      '<div style="flex:1;min-width:0">' +
      '<div class="bold" style="font-size:13.5px" data-go="asset/detail.html?id=' + s.asset_id + '">' + X.esc(a ? a.asset_name : s.session_name) + '</div>' +
      '<div class="xs muted" style="margin-top:2px">' + X.esc(s.session_id) + ' · ' + X.esc(s.rule_code || '') +
      ' · ' + X.esc(r.channel || 'PC') + ' 报名</div>' +
      '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">' + APP.sesTag(s.status) + result +
      (r.status === '已取消' ? APP.tag('报名已取消', '') : '') +
      (r.deposit_txn_id ? APP.tag('保证金已缴', 'ok') : APP.tag('保证金未缴', 'warn')) + '</div>' +
      '</div>' +
      '<div style="text-align:right;flex:none">' +
      '<div class="price" style="font-size:16px">' + X.w(s.status === '竞拍中' ? s.current_price : s.start_price) + '<span class="u">万</span></div>' +
      '<div class="xs muted">' + (s.status === '竞拍中' ? '当前价' : '起拍价') + '</div>' +
      (cd && !cd.over ? '<div class="xs ' + (cd.urgent ? 'c-danger' : 'c-pri') + ' mono">' + cd.txt + '</div>' : '') +
      '</div></div>' +
      '<div class="xs muted" style="margin-top:7px">我的出价 ' + myBids.length + ' 次' +
      (myBids.length ? '　最高 ¥' + X.yuan(Math.max.apply(null, myBids.map(function (b) { return b.bid_amount; }))) : '') +
      '　报名人数 ' + DB.all('bidRegs').filter(function (rr) { return rr.session_id === s.session_id && rr.status !== '已取消'; }).length + '</div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
      (['竞拍中', '报名中', '报名截止', '预告'].indexOf(s.status) >= 0
        ? '<button class="btn sm grow" data-go="trade/bidding.html?ses=' + s.session_id + '">进入竞价</button>'
        : '<button class="btn sm grow" data-go="trade/result.html?ses=' + s.session_id + '">查看结果</button>') +
      (!r.deposit_txn_id && r.status === '已报名'
        ? '<button class="btn sm line-pri grow" data-go="trade/deposit.html?reg=' + r.reg_id + '">缴纳保证金</button>'
        : '<button class="btn sm ghost grow" data-go="asset/detail.html?id=' + s.asset_id + '">资产详情</button>') +
      '</div></div></div>';
  }

  function bidRows() {
    var bids = APP.myBids().sort(function (a, b) { return String(b.bid_time).localeCompare(String(a.bid_time)); });
    if (!bids.length) return '<div class="empty"><div class="ei">🔨</div><div class="et">暂无出价记录</div>' +
      '<div class="es">报名并缴纳保证金后即可出价</div>' +
      '<button class="btn line-pri sm" style="margin-top:10px" data-go="asset/list.html">去浏览资产</button></div>';
    return '<div class="list tight">' + bids.map(function (b) {
      var s = DB.get('sessions', b.session_id);
      var a = s ? DB.get('assets', s.asset_id) : null;
      var isTop = s && s.top_bidder === me.subject_id && s.current_price === b.bid_amount;
      return '<a class="li" data-go="trade/bidding.html?ses=' + b.session_id + '">' +
        '<div class="li-main"><div class="li-t">' + X.esc(a ? a.asset_name : b.session_id) + '</div>' +
        '<div class="li-s">' + X.esc(b.bid_time) + ' · 序列 #' + b.bid_seq + ' · ' + X.esc(b.session_id) + '</div></div>' +
        '<div class="li-r"><div class="bold c-pri">' + X.w(b.bid_amount) + ' 万</div>' +
        '<div class="xs">' + (isTop ? '领先' : '被超越') + '</div></div></a>';
    }).join('') + '</div>';
  }

  function bodyHTML() {
    var tabs = '<div class="seg" style="margin-bottom:10px">' +
      seg('live', '进行中 (' + liveList().length + ')') +
      seg('end', '已结束 (' + endList().length + ')') +
      seg('bids', '出价记录 (' + APP.myBids().length + ')') +
      '</div>';
    var list;
    if (TAB === 'bids') list = bidRows();
    else {
      var arr = TAB === 'live' ? liveList() : endList();
      list = arr.length ? arr.map(sesCard).join('')
        : '<div class="empty"><div class="ei">🔨</div><div class="et">' +
          (TAB === 'live' ? '暂无进行中的竞拍' : '暂无已结束的竞拍') + '</div>' +
          '<button class="btn line-pri sm" style="margin-top:10px" data-go="asset/list.html">去浏览资产</button></div>';
    }
    return tabs + list;
  }
  function seg(k, t) { return '<button class="' + (TAB === k ? 'on' : '') + '" data-go="mine/bids.html?v=' + k + '">' + X.esc(t) + '</button>'; }

  APP.mount(APP.shell({
    title: '我的竞拍', back: false, tab: 'bids', sideActive: '我的-竞拍',
    body: '<div style="padding:12px">' + bodyHTML() + '</div>'
  }));
})();
</script>
</body>
</html>
