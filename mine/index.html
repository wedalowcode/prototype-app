<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的 · 中石化易派客</title>
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>
<script src="../../prototype-admin/assets/js/common.js"></script>
<script src="../assets/js/app.js"></script>
<script>
(function () {
  var U = WB_U, DB = WB_DB, E = WB_ENGINE, X = APP.X;
  APP.boot();
  var me = APP.me();

  function todos() {
    var out = [];
    APP.inProgressOrders().forEach(function (o) {
      var p = APP.perfOf(o.order_id);
      if (!p) return;
      if (!p.node_status.sign) out.push({ t: '待签署合同', s: o.order_id + ' · 截止 ' + p.sign_deadline, href: 'trade/contract.html?order=' + o.order_id, n: 1 });
      else if (!p.node_status.pay) out.push({ t: '待支付价款', s: o.order_id + ' · 应付 ¥' + X.yuan(p.payable_amount), href: 'trade/pay.html?order=' + o.order_id, n: 2 });
      else if (!p.node_status.delivery) out.push({ t: '待完成交割', s: o.order_id + ' · 截止 ' + p.pickup_deadline, href: 'trade/delivery.html?order=' + o.order_id, n: 3 });
    });
    APP.myRegs().forEach(function (r) {
      if (r.status === '已报名' && !r.deposit_txn_id) {
        var s = DB.get('sessions', r.session_id);
        out.push({ t: '待缴纳保证金', s: r.reg_id + ' · ¥' + X.yuan(r.deposit_amount) + (s ? ' · 截止 ' + X.fmtDT(s.reg_end) : ''), href: 'trade/deposit.html?reg=' + r.reg_id, n: 4 });
      }
    });
    return out;
  }

  function bodyHTML() {
    var regs = APP.myRegs(), bids = APP.myBids(), orders = APP.myOrders(), txns = APP.myTxns();
    var acct = APP.depositAccount();
    var myQuals = DB.all('quals').filter(function (q) { return q.subject_id === me.subject_id; });
    var passed = myQuals.filter(function (q) { return q.audit_status === '通过'; });
    var qualifyN = APP.tenantRelationsOf().filter(function (t) { return t.status === '生效'; }).length;
    var todo = todos();
    var wins = orders.length;

    return '<div class="card" style="background:linear-gradient(150deg,#c8102e,#8f0a1f);color:#fff;border:0">' +
      '<div class="cb" style="padding:16px 14px">' +
      '<div style="display:flex;gap:11px;align-items:center">' +
      '<div class="avatar" style="background:rgba(255,255,255,.2);color:#fff">' + X.esc(String(me.subject_name).slice(0, 1)) + '</div>' +
      '<div style="flex:1;min-width:0">' +
      '<div style="font-size:15.5px;font-weight:700">' + X.esc(me.subject_name) + '</div>' +
      '<div style="font-size:11.5px;opacity:.85;margin-top:2px">' + X.esc(me.uscc) + '</div>' +
      '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">' +
      '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' + (me.status === '已准入' ? '✓ 已实名认证' : X.esc(me.status)) + '</span>' +
      '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">' + X.esc(me.grade) + ' 级</span>' +
      '<span class="tag" style="background:rgba(255,255,255,.22);color:#fff">信用 ' + X.esc(me.credit_level) + '</span>' +
      '</div></div>' +
      '<button class="btn sm ghost" style="color:#fff;border-color:rgba(255,255,255,.4)" data-go="mine/cert.html">认证 ›</button>' +
      '</div>' +
      '<div style="display:flex;gap:10px;margin-top:13px;font-size:12px;opacity:.95">' +
      '<span>资质 ' + passed.length + '/' + myQuals.length + ' 有效</span>' +
      '<span>累计成交 ' + wins + ' 单</span>' +
      '<span>信用分 ' + me.credit_score + '</span>' +
      '</div></div></div>' +

    (todo.length
      ? '<div class="card" style="border:1px solid #f3c3cb"><div class="ch" style="background:var(--pri-l)">' +
        '<h3 style="color:var(--pri)">待办事项</h3><span class="sub" style="color:var(--pri)">' + todo.length + ' 项待处理</span></div>' +
        '<div class="list tight">' + todo.map(function (t) {
          return '<a class="li" data-go="' + t.href + '"><span style="font-size:17px">🔔</span>' +
            '<div class="li-main"><div class="li-t">' + X.esc(t.t) + '</div><div class="li-s">' + X.esc(t.s) + '</div></div>' +
            '<span class="arrow">›</span></a>';
        }).join('') + '</div></div>'
      : APP.card('待办事项', '<div class="note ok"><span class="ni">✓</span><div>暂无待办事项，一切正常。</div></div>')) +

    '<div class="grid2" style="margin-bottom:10px">' +
      cell('我的竞拍', regs.length + ' 个场次', 'mine/bids.html', '🔨') +
      cell('我的订单', orders.length + ' 单', 'mine/orders.html', '📋') +
      cell('保证金账户', '冻结 ¥' + X.w(acct.frozen) + ' 万', 'mine/deposit.html', '💰') +
      cell('参拍资格', qualifyN + ' 项生效关系', 'mine/access.html', '⛓️') +
      cell('我的认证', passed.length + '/' + myQuals.length + ' 有效', 'mine/cert.html', '🛡️') +
      cell('订阅与偏好', APP.mySubs().length + ' 条订阅', 'mine/subscription.html', '⚙️') +
      cell('消息中心', APP.unreadCount() + ' 条未读', 'mine/messages.html', '💬') +
      cell('帮助与客服', APP.myTickets().length + ' 个工单', 'mine/help.html', '💁') +
      '</div>' +

    APP.card('数据概览', '<div class="grid3">' +
      g('报名', regs.length) + g('出价', bids.length) + g('成交', wins) +
      g('保证金流水', txns.length) + g('看样预约', APP.myAppts().length) + g('工单', APP.myTickets().length) +
      '</div>') +

    APP.card('快捷服务', '<div class="list tight">' +
      '<a class="li" data-go="mine/help.html"><span style="font-size:17px">💁</span><div class="li-main"><div class="li-t">帮助与客服</div>' +
      '<div class="li-s">竞买须知、规则说明、在线客服、我的工单</div></div><span class="arrow">›</span></a>' +
      '<a class="li" data-go="asset/list.html"><span style="font-size:17px">🗂️</span><div class="li-main"><div class="li-t">浏览在售资产</div>' +
      '<div class="li-s">按品类 / 区域 / 价格筛选</div></div><span class="arrow">›</span></a>' +
      '<a class="li" data-toast="切换账号（原型演示）"><span style="font-size:17px">🔄</span><div class="li-main"><div class="li-t">切换登录主体</div>' +
      '<div class="li-s">当前：' + X.esc(me.subject_name) + '</div></div><span class="arrow">›</span></a>' +
      '<a class="li" id="resetDemo"><span style="font-size:17px">♻️</span><div class="li-main"><div class="li-t">重置原型数据</div>' +
      '<div class="li-s">清空本地演示数据并重新自举（不影响后台原型）</div></div><span class="arrow">›</span></a>' +
      '</div>');
  }

  function cell(t, s, href, ic) {
    return '<a class="gcell" data-go="' + href + '" style="text-decoration:none;color:inherit;text-align:left;padding:11px">' +
      '<div style="font-size:20px">' + ic + '</div>' +
      '<div class="bold" style="font-size:13px;margin-top:5px">' + X.esc(t) + '</div>' +
      '<div class="xs muted">' + X.esc(s) + '</div></a>';
  }
  function g(l, v) { return '<div class="gcell"><div class="gv">' + v + '</div><div class="gl">' + l + '</div></div>'; }

  function render() {
    APP.mount(APP.shell({
      title: '我的', back: false, tab: 'mine', sideActive: '我的',
      right: '<button class="ra" data-toast="设置（原型演示）">⚙️</button>',
      body: bodyHTML()
    }));
    var rd = document.getElementById('resetDemo');
    if (rd) rd.onclick = function () {
      APP.dialog({
        title: '重置原型数据',
        message: '', body: '将清空本机 localStorage 中的演示数据并重新自举，用于反复演示。' +
          '<br><span class="xs muted">仅影响竞买人 APP 原型的本地数据。</span>',
        okText: '确认重置', danger: true,
        onOk: function () {
          localStorage.removeItem('zyypk_admin_db_v1');
          localStorage.removeItem('zyypk_app_seed_v1');
          localStorage.removeItem('zyypk_app_me');
          location.reload();
        }
      });
    };
  }

  render();
})();
</script>
</body>
</html>
